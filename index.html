<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#02050b">
<meta name="color-scheme" content="dark">
<title>RudyOne Mobile V3</title>
<link rel="manifest" href="manifest.webmanifest">
<style>
html,body{margin:0;min-height:100%;background:#02050b;color:#f5fbff;font-family:system-ui,-apple-system,Segoe UI,sans-serif}#boot,#gate,#error{min-height:100vh;display:grid;place-items:center;padding:22px;box-sizing:border-box}#gate,#error{display:none}.box{width:min(430px,100%);border:1px solid #1b637f;border-radius:24px;background:linear-gradient(160deg,#071521,#030a11);padding:24px;box-sizing:border-box;box-shadow:0 18px 70px rgba(0,0,0,.55)}.brand{font-size:34px;font-weight:950;letter-spacing:2.5px}.sub{color:#61dcff;font-size:12px;font-weight:900;letter-spacing:1.4px;margin:6px 0 20px}.field,.go{width:100%;min-height:56px;border-radius:14px;box-sizing:border-box;font:17px system-ui}.field{border:1px solid #246984;background:#020b13;color:#fff;padding:11px 13px}.go{margin-top:9px;border:1px solid #61dcff;background:#0b526d;color:#fff;font-weight:950}.err{min-height:20px;margin-top:9px;color:#ff9b9b;font-size:13px}#boot{color:#61dcff;font-weight:900;letter-spacing:1.2px}.muted{color:#9bb4c3;font-size:13px;line-height:1.4}
</style>
</head>
<body>
<div id="boot">STARSHIP · APERTURA PONTE…</div>
<div id="gate"><div class="box"><div class="brand">STARSHIP</div><div class="sub">MOBILE V3 · ABBINAMENTO UNA SOLA VOLTA</div><input id="code" class="field" type="password" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="Codice di abbinamento"><button id="enter" class="go" type="button">ABBINA E APRI</button><div id="err" class="err"></div></div></div>
<div id="error"><div class="box"><div class="brand">STARSHIP</div><div class="sub">CONNESSIONE TEMPORANEAMENTE NON DISPONIBILE</div><div id="errtxt" class="muted"></div><button id="retry" class="go" type="button">RIPROVA</button></div></div>
<script>
(()=>{
const BASE='https://aropywroudfriiqbmwhp.supabase.co/functions/v1';
const AUTH=BASE+'/starship-v3-mobile-auth';
const UI=BASE+'/starship-v2-ui/bootstrap.js';
const UIBASE=BASE+'/starship-v2-ui';
const DK='sv3_device',SK='sv2',PK='sv2_persist';
const boot=document.getElementById('boot'),gate=document.getElementById('gate'),error=document.getElementById('error'),code=document.getElementById('code'),enter=document.getElementById('enter'),err=document.getElementById('err'),errtxt=document.getElementById('errtxt'),retry=document.getElementById('retry');
const nativeFetch=window.fetch.bind(window);let renewing=false;
function saveSession(t){sessionStorage.setItem(SK,t);localStorage.setItem(PK,t)}
function clearSession(){sessionStorage.removeItem(SK);localStorage.removeItem(PK)}
function showGate(msg=''){clearSession();boot.style.display='none';error.style.display='none';gate.style.display='grid';err.textContent=msg;enter.disabled=false;try{code.focus()}catch{}}
function showError(msg){boot.style.display='none';gate.style.display='none';error.style.display='grid';errtxt.textContent=msg||'Riprova tra poco. Il telefono resta autorizzato.'}
async function sessionFromDevice(){const d=localStorage.getItem(DK);if(!d)return {kind:'NO_DEVICE'};try{const r=await nativeFetch(AUTH+'/session',{method:'POST',headers:{authorization:'Bearer '+d,'content-type':'application/json'},cache:'no-store'});const z=await r.json().catch(()=>({}));if(r.status===401){localStorage.removeItem(DK);clearSession();return {kind:'REVOKED'}}if(!r.ok||!z.session_token)return {kind:'TEMP',message:z.error||('HTTP '+r.status)};saveSession(z.session_token);return {kind:'OK'}}catch(e){return {kind:'TEMP',message:e?.message||String(e)}}
async function enroll(){const v=String(code.value||'').trim();if(!v)return;enter.disabled=true;err.textContent='';try{const r=await nativeFetch(AUTH+'/enroll',{method:'POST',headers:{'x-pair-code':v,'content-type':'application/json'},cache:'no-store'});const z=await r.json().catch(()=>({}));if(!r.ok||!z.device_token||!z.session_token)throw Error(z.error||'Abbinamento non riuscito');localStorage.setItem(DK,z.device_token);saveSession(z.session_token);location.replace(location.pathname)}catch(e){err.textContent=e?.message||'Abbinamento non riuscito';enter.disabled=false}}
async function loadUI(){if(window.__STARSHIP_V3_LOADING__)return;window.__STARSHIP_V3_LOADING__=1;gate.style.display='none';error.style.display='none';boot.style.display='grid';try{const r=await nativeFetch(UI+'?v=mobilev3-pages',{cache:'no-store'});if(!r.ok)throw Error('UI HTTP '+r.status);let js=await r.text();js=js.replaceAll('__BASE__',UIBASE);if(js.includes('__BASE__'))throw Error('UI base non risolta');const blob=new Blob([js],{type:'application/javascript'}),src=URL.createObjectURL(blob),s=document.createElement('script');s.src=src;s.onload=()=>{URL.revokeObjectURL(src);try{boot.remove()}catch{}};s.onerror=()=>{URL.revokeObjectURL(src);showError('Errore apertura Ponte di Comando')};document.body.appendChild(s)}catch(e){window.__STARSHIP_V3_LOADING__=0;showError('Errore apertura Ponte: '+(e?.message||e))}}
window.fetch=async(...args)=>{const r=await nativeFetch(...args);if(r.status!==401||renewing)return r;let msg='';try{const z=await r.clone().json();msg=String(z?.error||'').toLowerCase()}catch{}if(!msg.includes('sessione non valida'))return r;renewing=true;const q=await sessionFromDevice();if(q.kind==='OK'){location.reload();return r}renewing=false;if(q.kind==='REVOKED'||q.kind==='NO_DEVICE')showGate('Telefono da abbinare');else showError('Sessione non rinnovabile al momento. '+(q.message||''));return r};
retry.onclick=()=>location.reload();enter.onclick=enroll;code.addEventListener('keydown',e=>{if(e.key==='Enter')enroll()});
(async()=>{if(new URLSearchParams(location.search).get('reset')==='1'){localStorage.removeItem(DK);clearSession()}const q=await sessionFromDevice();if(q.kind==='OK')return loadUI();if(q.kind==='NO_DEVICE'||q.kind==='REVOKED')return showGate();showError('Starship non raggiungibile. Il telefono resta autorizzato. '+(q.message||''))})();
})();
</script>
</body>
</html>
