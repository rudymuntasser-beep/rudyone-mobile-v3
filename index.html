<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#02050b">
<meta name="color-scheme" content="dark">
<title>RudyOne Mobile V3</title>
<link rel="manifest" href="manifest.webmanifest">
<style>
html,body{margin:0;min-height:100%;background:#02050b;color:#f5fbff;font-family:system-ui,-apple-system,Segoe UI,sans-serif}#boot,#gate,#error{min-height:100vh;display:grid;place-items:center;padding:22px;box-sizing:border-box}#gate,#error{display:none}.box{width:min(430px,100%);border:1px solid #1b637f;border-radius:24px;background:linear-gradient(160deg,#071521,#030a11);padding:24px;box-sizing:border-box;box-shadow:0 18px 70px rgba(0,0,0,.55)}.brand{font-size:34px;font-weight:950;letter-spacing:2.5px}.sub{color:#61dcff;font-size:12px;font-weight:900;letter-spacing:1.4px;margin:6px 0 20px}.field,.go{width:100%;min-height:56px;border-radius:14px;box-sizing:border-box;font:17px system-ui}.field{border:1px solid #246984;background:#020b13;color:#fff;padding:11px 13px}.go{margin-top:9px;border:1px solid #61dcff;background:#0b526d;color:#fff;font-weight:950}.err{min-height:20px;margin-top:9px;color:#ff9b9b;font-size:13px}#boot{color:#61dcff;font-weight:900;letter-spacing:1.2px}.muted{color:#9bb4c3;font-size:13px;line-height:1.4}
</style>
</head>
<body>
<div id="boot">STARSHIP · APERTURA PONTE…</div>
<div id="gate"><div class="box"><div class="brand">STARSHIP</div><div class="sub">MOBILE V3 · ABBINAMENTO UNA SOLA VOLTA</div><input id="code" class="field" type="password" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="Codice di abbinamento"><button id="enter" class="go" type="button">ABBINA E APRI</button><div id="err" class="err"></div></div></div>
<div id="error"><div class="box"><div class="brand">STARSHIP</div><div class="sub">CONNESSIONE TEMPORANEAMENTE NON DISPONIBILE</div><div id="errtxt" class="muted"></div><button id="retry" class="go" type="button">RIPROVA</button></div></div>
<script src="app.js"></script>
</body>
</html>
